# The rules the per-rule floor counts (B1 plan §3.4): 75 rules, 62 Malaysian and 13 Singaporean.
# carrier: how the rule appears in an answer key (a line basis, a finding, a buyer action). problem_form: the rule can
# decide a wrongly charged or undercharged line (52 Malaysian, 6 Singaporean; tests/generator/test_rule_table.py checks
# this against the golden keys). types: the exception types whose cases can carry it (empty: any non-hand-over type).
# foreign / domestic: it needs a foreign / a domestic supplier. correct_form: false when every appearance is a problem
# form. supplier: the kind of supplier it needs (the Malaysian pack builds one of each kind per company). companies: the
# company kinds that can carry it. windows: per form, the invoice dates it can be planted on (rule sheet v0.10 dates;
# absent: the country window). needs: what the case's supplier must be able to do: service (charge service tax),
# goods (a manufacturer that charges sales tax), phase (past its e-invoicing relaxation period), not_public_scope (a
# 2025-scope line the Federal or State Government would exempt instead, K-5, L-7, P-8), b2b (a supplier whose own
# rule would decide first: group relief, a transitional contract), gst (a supplier registered for GST). whole_case:
# the rule decides every line of the invoice (SG-4), so the case isn't a mixed one. exclude_types: exception types whose
# own problem would decide the rule's line (a missing tax-invoice particular makes every line with GST SG-2).
# branches: per form, the deciding branches the rule's recipe takes in turn (review of B1-5), so the floor gives the
# form 2 appearances per branch in train and 1 in test. form_needs: per form, what the supplier must do on top of
# needs (not_entitled: a supplier not entitled to charge GST, SG-4). min_lines: per form, the fewest lines its case needs.
# alternate_foreign: its appearances alternate between foreign and domestic suppliers. alone: forms whose case plants
# no other rule (a branch's supplier no other rule's line could take); alone_with: the rules it may share one with.
# window_turns: per form, date windows its appearances take in turn (branches near different dates). Supplier pool
# needs (late_turn_*, zone_turn_*, foreign_turn) and the branch turns are in the country's generation.py.
not_counted:
  MS-10: dispatcher; met through P-1 to P-20
  MG-6: dispatcher; met through G-1, G-3, G-4 and G-5
  P-21: not an engine rule (domestic electricity is not a company purchase)
  G-2: not an engine rule (imports)
  G-6: not an engine rule (re-imports)
  G-7: not an engine rule (refund windows)
