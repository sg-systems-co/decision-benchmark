# Branches the rules engine can decide that the splits don't plant at the branch floor (review of B1-5: at least 2 cases
# in train and 1 in test for each in-window branch), each with its reason. generator/branches.py lists the branches;
# report/branches.json gives each one's planted count and, for these, the reason; tests/generator/
# test_branch_coverage.py checks that every branch below the floor is here and that nothing here is planted at the floor
# or no longer exists. Hand-over branches need no entry: HAND_OVER is planted only in Ambiguous cases (limit 5 plants the
# unconfirmed treaty rows; the missing-information cases are B1-6's H3).
MY:
  MS-5 b2b.check#1: >-
    needs facts no generated company has: a buyer regulated by Labuan FSA (B2B order item 6, from 1 Jul 2025)
  MS-8 imported.assess#1: >-
    outside the case window: no tax on imported services before 1 Jan 2019 (the window starts 2 Jan 2024)
  MS-8 imported.assess#3: >-
    outside the case window: a foreign registered person's service a registered buyer accounts for under MS-8, before
    B2B order item 3 came in on 1 Jan 2020 (from then MS-5)
  P-20 imported.assess#1: >-
    outside the case window: imported services to a company in Labuan, exempt to 31 Dec 2021
  MS-9 imported.assess#1: >-
    needs facts no generated company has: a buyer not registered for service tax (every generated Malaysian company
    is a registered person; an FRP's digital service to one is then undercharged)
  WH-2 withholding._s109b#1 via withholding#1: >-
    outside the case window: services performed outside Malaysia are chargeable only when performed 17 Jan-5 Sep 2017
  WH-2 withholding._s109b#2 via withholding#1: &before_dec_2018 >-
    outside the case window: an invoice before 5 Dec 2018, when a payer bearing the tax regrossed the base
  WH-2 withholding._s109b#2 via withholding#2: *before_dec_2018
  WH-2 withholding._s109b#2 via withholding#3: *before_dec_2018
  WH-2 withholding._s109b#5 via withholding#1: *before_dec_2018
  WH-2 withholding._s109b#5 via withholding#2: *before_dec_2018
  WH-2 withholding._s109b#5 via withholding#3: *before_dec_2018
  ME-3 einvoice.buyer_in_phase return#1: >-
    needs facts no generated company has: a company record that doesn't show its e-invoicing phase (every company's
    turnover band is in its record, review of B1-4 fix 1); the branch is the date before 1 Aug 2024 when that decides
    nothing
  ME-3 einvoice.buyer_in_phase return#2: >-
    needs facts no generated company has: a buying company that is itself exempt from e-invoicing (a foreign
    diplomatic office, an individual not in business, a statutory body or international organisation to 30 Jun 2025)
  ME-4 fact missing description: >-
    not plantable as ME-4: a line without a description misses a MyInvois mandatory field too, and the key keeps one
    finding per code, which then names ME-2
  ME-4 fact missing ringgit_amounts: >-
    not generated: a domestic SST-registered supplier invoicing in another currency without ringgit amounts (the
    generated domestic suppliers invoice in ringgit)
SG:
  SG-2 fact foreign currency without SGD amounts: >-
    not generated: an invalid tax invoice in another currency (invalid-invoice cases stay domestic and in SGD, review
    of B1-4 fix 4)
