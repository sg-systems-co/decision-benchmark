# Generator config for ap-invoices (B1 plan §3 and §6), read by spec.py into TaskSetSpec.generation.
# Exception shares are TaskSetSpec.quotas; two-problem pairs are content/hardcases/pairs.yaml; rules are
# content/generator/rules.yaml.

countries: [MY, SG]

# B1 plan §6 (decision 6): one window per country.
windows:
  MY: ['2024-01-02', '2026-10-31']
  SG: ['2023-07-01', '2026-10-31']

# Step 11 plan §5.2: priority tiers. Same order as TaskSetSpec.quotas.
types:
- {name: clean}
- {name: tax_problem, tier: 3, tax: true, foreign_countries: [MY]}   # a Singapore tax problem needs a GST-registered (so domestic) supplier, except SG-4, which decides the whole invoice
- {name: price_mismatch, tier: 4}
- {name: quantity_mismatch, tier: 4}
- {name: invalid_invoice, tier: 3, foreign: false}   # the invoice requirements (e-invoice, SST particulars) bind domestic suppliers
- {name: duplicate, tier: 2}
- {name: not_received, tier: 4}
- {name: no_po_or_above_limit, tier: 5}
- {name: bank_change, tier: 1}
- {name: ambiguous, handover: true}

# B1 plan §3.2: half of every split is hard; scan-only 32% of the hard cases (320 / 80 / 48), capped at a third;
# missing information is two thirds of the hand-over type (40 / 10 / 6); conflicting documents the rest.
hard_cases:
  share: '50'
  scan_only_share_of_hard: '32'
  scan_only_cap_of_hard: '1/3'
  missing_share_of_handover: '2/3'
  conflict_row_cap: '1/4'
  type_hard_share_band: ['30', '70']
  # B1 plan §3.2a. Every type except the hand-over type can carry a precedence pattern: the key's tax lines, findings
  # and reason codes follow the governing document whatever the decision.
  rows:
  - {id: supplier_registration, countries: [MY, SG], types: &h2types [clean, tax_problem, price_mismatch, quantity_mismatch, invalid_invoice, duplicate, not_received, no_po_or_above_limit, bank_change]}
  - {id: group_relation, countries: [MY], types: *h2types}
  - {id: exemption_certificate, countries: [MY], types: *h2types}
  - {id: zone, countries: [MY], types: *h2types}
  - {id: contract_record, countries: [MY], types: *h2types}
  - {id: time_of_supply, countries: [MY, SG], types: *h2types}
  - {id: price, countries: [MY, SG], types: *h2types}
  - {id: certificate_of_residence, countries: [MY, SG], types: *h2types}
  - {id: partial_exemption, countries: [SG], types: *h2types}

# B1 plan §3.3: at least 12% mixed (240 / 60 / 36), a third of them Malaysian §5-b split cases (80 / 20 / 12).
mixed:
  share: '12'
  split_share: '1/3'
  split_countries: [MY]
  # The §5-b splits the recipes plant (packages, L-8, P-12, P-16) all decide from 1 Mar 2024 (packages) or later.
  split_window: ['2024-03-01', '2026-10-31']
  split_needs: [service]

# B1 plan §3.4: foreign-supplier lines carry MS-8, ME-3 and the withholding rules (15% of each country's cases).
foreign_share: '15'

# B1 plan §3.3: lines per case.
lines: {'1': '45', '2': '30', '3': '15', '4-6': '10'}

# B1 plan §3.4 (decision 5): 16 per rule in train with 2 problem forms per rule that has one; 4 in test with 2
# problem lines per family; 2 in a 300-case split. Review of B1-5: a rule whose recipe takes several deciding branches
# in turn (rules.yaml branches) gets 2 appearances per branch in train and 1 in test.
rule_floor:
- {min_cases: 2000, per_rule: 16, problem_per_rule: 2, per_branch: 2}
- {min_cases: 500, per_rule: 4, problem_per_family: 2, per_branch: 1}
- {min_cases: 300, per_rule: 2}

# Suppliers of each special kind (rules.yaml supplier) per split: three in train, two in test, one in a 300-case split
# (review of B1-4), so a rule that needs one doesn't always come with the same name, address and bank account.
special_suppliers:
- {min_cases: 2000, per_kind: 3}
- {min_cases: 500, per_kind: 2}
- {min_cases: 300, per_kind: 1}

# The supplier kinds the rules need (rules.yaml supplier) and what each can't do (rules.yaml needs): the co-owner of a
# rented property isn't registered and isn't in an e-invoicing phase (K-8); the Government exempts its 2025-scope
# services itself (K-5, L-7, P-8); group relief (MS-6) and the transitional contracts (K-4, L-1) decide before the
# B2B order (MS-5).
supplier_lacks:
  co_owner: [service, goods, phase, phase1, b2b]
  government: [not_public_scope, b2b]
  local_authority: [not_public_scope, b2b]
  sg_unregistered: [gst]
  group: [b2b]
  k4_landlord: [b2b]
  l1_contractor: [b2b]
  einv_small: [goods, phase, phase1]
  einv_unknown: [goods, phase, phase1]
  einv_3m5m: [goods, phase, phase1]

# Needs no one supplier meets together: registered for GST and not (SG-4).
needs_conflict:
- [gst, no_gst]

# B1 plan decision 3: buying companies per split (half per country).
companies:
- {min_cases: 2000, companies: 60}
- {min_cases: 500, companies: 20}
- {min_cases: 300, companies: 12}

# B1 plan §3.4: date-boundary floor, 2 train and 1 test case within 31 days on each side of every boundary.
boundary_floor:
- {min_cases: 2000, per_side: 2, days: 31}
- {min_cases: 500, per_side: 1, days: 31}

# B1 plan §6, plus the dated branches inside the window that engine 0.10.3 added (marked 0.10.3). `day` is the first
# day of the new state. Pulau 1 (1 Dec 2024) isn't planted. branch: the recipe (countries/my/planting.py) for a line
# whose answer turns on the date, planted on the boundary's slots on each side (review of B1-4); supplier, companies,
# needs, types: what the branch line takes, as for a rule. 1 Sep 2025 (P-9 for foreign-company buyers) has none: the
# buyers are Malaysian companies, so no case can turn on it.
boundaries:
- {country: MY, day: '2024-02-26', note: '0.10.3: 26 Feb 2024 additions (karaoke, G(n), I12, Group J); STP 1/2024 starts', branch: scope_2024, needs: [service]}
- {country: MY, day: '2024-03-01', note: 'service tax 6% -> 8%; STP 1/2024 existing registrants charge from 1 Mar', branch: rate_2024, needs: [service]}
- {country: MY, day: '2024-04-01', note: '0.10.3: STP 1/2024 new registrants charge from 1 Apr', branch: stp_new_registrant, supplier: new_registrant}
- {country: MY, day: '2024-05-01', note: '0.10.3: G(n) in group relief (P.U. (A) 354/2024)', branch: gn_group_relief, supplier: group, companies: [it, fin, builder, plain]}
- {country: MY, day: '2024-08-01', note: 'ME-1 implementation, above RM100m', branch: me3_phase_1, companies: [it]}
- {country: MY, day: '2024-11-27', note: '0.10.3: wellness T&CM premises exclusion (P.U. (A) 354/2024 para 2(c))', branch: wellness_tcm, needs: [service]}
- {country: MY, day: '2025-01-01', note: 'ME-1 implementation, RM25m-100m', branch: me3_phase_2, companies: [fin]}
- {country: MY, day: '2025-02-01', note: 'ME-1 relaxation ends 31 Jan 2025', branch: me1_relaxation_end, needs: [phase1], types: {after: [invalid_invoice]}, exclude_types: {before: [invalid_invoice]}, findings: [after]}
- {country: MY, day: '2025-05-30', note: '0.10.3: MS-7 area order items 5 and 7 (P.U. (A) 165/2025)', branch: ms7_items_5_7, needs: [service]}
- {country: MY, day: '2025-07-01', note: '2025 SST expansion and orders; ME-1 RM5m-25m and relaxation end 30 Jun 2025; K-1, K-4, K-5/L-7 start', branch: scope_2025, companies: [it, fin, plain, msme, new_sme], needs: [service, not_public_scope, b2b]}
- {country: MY, day: '2025-09-01', note: '0.10.3: P-9 foreign-company buyers'}
- {country: MY, day: '2025-10-01', note: 'K-5 and L-7 local authorities end 30 Sep 2025', branch: local_authority_end, supplier: local_authority, companies: [it, fin, builder, plain]}
- {country: MY, day: '2026-01-01', note: 'rental 6%; K-1 RM1m-1.5m; G-3; ME-1 up to RM5m and relaxation end 31 Dec 2025', branch: rental_rate_2026, companies: [it, fin, builder, plain], needs: [service, not_public_scope, b2b]}
- {country: MY, day: '2026-05-01', note: 'P-15', branch: p15_taxable, needs: [service, b2b]}
- {country: MY, day: '2026-06-01', note: 'P-7 TIA-i', branch: tia_i, needs: [service, not_public_scope]}
- {country: MY, day: '2026-07-01', note: 'K-4 ends 30 Jun 2026; P-10; ME-1 new businesses', branch: k4_end, supplier: k4_landlord, companies: [it, fin, builder, plain]}
- {country: MY, day: '2026-09-01', note: 'G-3 ends 31 Aug 2026; MG-4 Schedule B items 5-7', branch: g3_end, needs: [goods]}
- {country: MY, day: '2026-09-22', note: 'P-9 DGTA-approved organisations', branch: dgta_mro, supplier: dgta_mro, companies: [plain]}
- {country: MY, day: '2024-08-01', note: 'ME-1 first phase starts: a supplier below RM1m is exempt either side (review of B1-5)', branch: me1_small, supplier: einv_small, exclude_types: {before: [invalid_invoice], after: [invalid_invoice]}}
- {country: MY, day: '2025-02-01', note: 'ME-1: no supplier past its relaxation period before 1 Feb 2025, so a phase not shown decides nothing (review of B1-5)', branch: me1_unknown_phase, supplier: einv_unknown, exclude_types: {before: [invalid_invoice], after: [invalid_invoice]}}
- {country: MY, day: '2025-07-01', note: 'ME-1: statutory bodies and local authorities exempt to 30 Jun 2025, then for statutory fees only (review of B1-5)', branch: me1_public_body, supplier: local_authority, exclude_types: {before: [invalid_invoice], after: [invalid_invoice]}}
- {country: MY, day: '2026-01-01', note: 'ME-1: RM3m-5m phase starts, relaxation to 31 Dec 2027 (review of B1-5)', branch: me1_phase_3m5m, supplier: einv_3m5m, exclude_types: {before: [invalid_invoice], after: [invalid_invoice]}}
- {country: SG, day: '2024-01-01', note: 'GST 8% -> 9% (SG-3)', branch: gst_rate_2024, needs: [gst], companies: [plain, receipts]}
