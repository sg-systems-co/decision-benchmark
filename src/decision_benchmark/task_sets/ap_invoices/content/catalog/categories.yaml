# Release catalog for ap-invoices (step-11 plan §7.1). Format and checks: README.md in this folder.
#
# How the Malaysian sales-tax classes were set (decision Q9 needs a source for every goods rate):
#   - sales_10: the HS heading appears neither in the First Schedule (5%) or Second Schedule of the
#     Sales Tax (Rate of Sales Tax) Order 2025 [P.U. (A) 170/2025] nor in the Sales Tax (Goods
#     Exempted from Sales Tax) Order 2025 [P.U. (A) 171/2025], so paragraph 2(1) of the rate order
#     (10% on all taxable goods) applies to the whole heading.
#   - sales_exempt: the heading is in the exemption order and appears nowhere in the rate order.
#   - sales_5: the exact subheading (10-digit code in `note`) is listed in the First Schedule of
#     the rate order and the heading is not in the exemption order.
#   - Read from the gazetted PDFs linked on mysst.customs.gov.my/sst-orders/, with every later
#     amendment listed there: rate order P.U. (A) 199/2025, 399/2025 and 281/2026; exemption order
#     P.U. (A) 200/2025 and 400/2025. None of them touches a heading or subheading used in the v1
#     entries (P.U. (A) 400/2025 also inserts 12.01, deletes 12.06, renumbers one 49.01 subheading and
#     adds 8711.20.96/99 00; only motorcycles_50_150cc below uses one of these). Checked 16 Nov 2026,
#     rechecked 19 Nov 2026. P.U. (A) 165/2026 and 303/2026 (listed in rule sheet section 2 among the
#     exemption order's amendments) amend the Sales Tax (Persons Exempted from Payment of Tax) Order 2018
#     instead (Schedule A items 27, 58, 58A; Schedule B items 5-7 from 1 Sep 2026) and name no tariff code.
# Before 1 Jul 2025 (`earlier_classes`, MG-3): the Sales Tax (Rates of Tax) Order 2018 [P.U. (A) 221/2018]
#   and (Goods Exempted from Tax) Order 2018 [P.U. (A) 219/2018] applied from 1 Sep 2018, and the 2022
#   orders [P.U. (A) 176/2022, 175/2022] from 1 Jun 2022 until the 2025 orders revoked them. The same three
#   rules set each class, read at the heading or subheading the entry names. A heading that is only partly
#   in an earlier exemption order has no earlier class (HAND_OVER before 1 Jul 2025). No v1 entry's class
#   differs between the 2018 and 2022 orders, so each has one period, 1 Sep 2018 to 30 Jun 2025. Read
#   19 Nov 2026 with every amendment (none touches a v1 entry except P.U. (A) 228/2018, which inserts
#   8711.20.96 from 1 Sep 2018):
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Rates-Of-Tax-Order-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Rates-Of-Tax-Order-Amd-1-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Rates-Of-Tax-Order-Amd-2-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Rates-Of-Tax-Order-Amd-3-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/sales-tax-rate-of-tax-amendment-2019.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Rates-Of-Tax-Order-2022_PUA176.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Rate-of-Tax-Amendment-2023-PUA-102.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Goods-Exempted-From-Tax-Order-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Goods-Exempted-From-Tax-Order-Amd-1-2018.pdf
#     https://lom.agc.gov.my/ilims/upload/portal/akta/outputp/pua_20180906_PUA234.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Goods-Exempted-From-Tax-Order-Amd-3-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Goods-Exempted-From-Tax-Order-Amd-4-2018.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Goods-Exempted-From-Tax-Order-2022_PUA175.pdf
#     https://mysst.customs.gov.my/wp-content/uploads/2025/03/Sales-Tax-Goods-Exempted-From-Tax-Amendment-Order-2023_PUA109.pdf
#     https://lom.agc.gov.my/ilims/upload/portal/akta/outputp/1946278/PUA%20401.pdf
#   (P.U. (A) 234/2018 and 401/2023 come from the e-Federal Gazette: MySST's row for 234/2018 links the rate
#   order's amendment instead, and 401/2023 is not on MySST.)
# Singapore: a category gets an SG profile only when Regulation 26/27 blocks the claim.
version: 1
