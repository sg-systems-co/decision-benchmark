# Release catalog for ap-invoices (step-11 plan §7.1). Format and checks: README.md in this folder.
#
# How the Malaysian sales-tax classes were set (decision Q9 needs a source for every goods rate):
#   - sales_10: the HS heading appears neither in the First Schedule (5%) or Second Schedule of the
#     Sales Tax (Rate of Sales Tax) Order 2025 [P.U. (A) 170/2025] nor in the Sales Tax (Goods
#     Exempted from Sales Tax) Order 2025 [P.U. (A) 171/2025], so paragraph 2(1) of the rate order
#     (10% on all taxable goods) applies to the whole heading.
#   - sales_exempt: the heading is in the exemption order and appears nowhere in the rate order.
#   - No sales_5 category: the official text could only be checked at heading level, and every
#     5% heading we looked at could be split by subheading. 5% goods are added once the
#     subheading lists are checked.
#   - Both orders were read with their July 2025 amendment orders (Kertas Statut 108 and 109 of
#     2025). The 1 January 2026 exemptions (animal feed, fertiliser, pesticides) touch no category
#     here.
# Singapore: a category gets an SG profile only when Regulation 26/27 blocks the claim.
version: 1
categories:

