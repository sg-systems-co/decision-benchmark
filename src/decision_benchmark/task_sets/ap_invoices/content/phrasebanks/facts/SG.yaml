# Starter fact expressers, Singapore, English (B1-5; B1-6 and B2 add variants and languages). As
# content/phrasebanks/facts/MY.yaml: a fact no structured field holds is stated as a phrase in the invoice line
# description, and reads back to its value.
facts:
  purchase_attribution:
    kind: enum
    values:
      taxable: [for our taxable supplies]
      exempt: [for our exempt supplies]
      residual: [for both taxable and exempt supplies]
  delivery_date:
    kind: date
    templates: ["service performed on {value}"]
  place_of_performance:
    kind: enum
    values:
      in_country: [work done in Singapore]
  business_purpose:
    kind: bool
    values:
      true: [for our business]
      false: ["for personal use, not for the business"]
  low_value_goods:
    kind: bool
    values:
      true: ["low-value goods, S$400 or less"]
      false: [goods above the low-value threshold]
  car_used_by_third_party:
    kind: bool
    values:
      true: ["car used by a third party, under the IRAS conditions"]
      false: [car kept for our own staff]
  vehicle_registered_on:
    kind: date
    templates: ["business service passenger vehicle first registered on {value}"]
  vehicle_is_motor_car:
    kind: bool
    values:
      true: [a passenger motor car]
      false: [a licensed taxi, a car registered for school transport, a goods vehicle]
  staff_medical_obligatory:
    kind: bool
    values:
      true: [required under the Work Injury Compensation Act, required under our collective agreement, treatment for a work-related health risk under written law]
      false: [a voluntary staff benefit]
  insurance_obligatory:
    kind: bool
    values:
      true: [cover obligatory under the Work Injury Compensation Act, cover obligatory under our collective agreement]
      false: [voluntary cover for staff]
