# Allowed two-problem pairs (step 11 plan §5.1, B1 plan §3.1): (primary, secondary). The secondary is always a problem
# of a lower priority tier (step 11 §5.2: 1 fraud, 2 duplicate, 3 invalid invoice and wrongly charged tax, 4
# mismatch, 5 routing), so the primary still sets the decision. Hand-over cases never take a second problem (Q14),
# and no pair has two problems of the same tier.
share: '15'
pairs:
