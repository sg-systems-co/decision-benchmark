table: LHDN Double Taxation Agreements withholding tax rates
units: per cent, as printed by LHDN; NIL = no withholding; footnote marks such as (iv) are LHDN's
notes:
- (i) The effective tax rate will be either the DTA rates or the Malaysia domestic rate whichever lower. (ii) There is no withholding tax on dividends paid by Malaysia companies. (iii) The payer need to retain Certificate of Tax Residence of the payee issued by the tax authority from the country of residence for audit purposes. (iv) Withholding tax rate of 10% is only applicable for interest payment paid or incurred by an enterprise in an industrial undertaking. (v) DTA without article Technical Fees/Other Income/applicable article related to services, royalty(ies) rate(s) is/are applicable for services covered under the definition of royalties
- All withholding tax rates on interest, royalties and fees for technical services are as provided under the ITA 1967.
