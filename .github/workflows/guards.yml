name: guards

# The two repo guards (docs/plans/step-08-plan.md, section 8):
#   1. hidden-split files or hidden answer keys must never appear in this repo
#   2. no token may be committed
# Runs without any secrets.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: false

      - name: Install pinned dependencies
        run: uv sync --locked

      - name: Install gitleaks (pinned, checksum verified)
        run: .github/scripts/install-gitleaks.sh

      - name: Unit tests (include the guard tests)
        env:
          REQUIRE_GITLEAKS: "1"
        run: uv run --locked pytest -q

      - name: Hidden-split and secret check on the repo
        run: uv run --locked python release/check_public.py --mode repo

      - name: Secret scan over the full git history
        run: gitleaks git . --redact --no-banner --log-level warn
